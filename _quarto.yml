project:
  type: website
  output-dir: "docs"

website:
  title: "Mert Kobaş"
  description: "Mert Kobaş — Psychology Ph.D. candidate at NYU studying language development, explanatory reasoning, and reasoning in large language models."
  site-url: https://mertkobas.github.io
  favicon: files/favicon-512.png
  image: profile.png
  open-graph: true
  twitter-card:
    creator: "@mertkobas"
    card-style: summary
  navbar:
    pinned: true
    right:
      - text: "Home"
        file: index.qmd
      - text: "Research"
        file: research/index.qmd
      - text: "Teaching"
        file: teaching.qmd
      - text: "Blog"
        file: blog/index.qmd
      - text: "Other Works"
        file: other-works.qmd
      - text: "CV"
        file: MertCv.pdf
  page-footer:
    left: "© 2026 Mert Kobaş"
    center: "Built with [Quarto](https://quarto.org)"
    right:
      - icon: envelope
        href: "mailto:mertkobas@nyu.edu"
        aria-label: Email
      - icon: mortarboard
        href: "https://scholar.google.com/citations?user=DTqSxk4AAAAJ&hl=en"
        aria-label: Google Scholar
      - icon: github
        href: "https://github.com/mertkobas"
        aria-label: GitHub
      - icon: twitter
        href: "https://x.com/mertkobas"
        aria-label: Twitter
      - icon: linkedin
        href: "https://www.linkedin.com/in/mertkobas"
        aria-label: LinkedIn

format:
  html:
    theme: 
      - html/ath.scss
    grid: 
      body-width: 900px
    toc: false
    code-link: true
    anchor-sections: true
    fig-cap-location: margin
    reference-location: margin
    footnotes-hover: true
    highlight-style: monokai
    

editor: visual

